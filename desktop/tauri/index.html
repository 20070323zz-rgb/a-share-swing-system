<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A 股 ETF 桌面控制台</title>
    <script type="module" src="/src/main.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 25% 0%, rgba(56, 189, 248, .24), transparent 34%), #08111f;
        color: #e5eefb;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(720px, calc(100vw - 32px));
        border: 1px solid rgba(148, 163, 184, .2);
        background: rgba(15, 27, 46, .86);
        border-radius: 24px;
        padding: 28px;
        box-shadow: 0 24px 70px rgba(0,0,0,.35);
      }
      h1 { margin: 0 0 10px; }
      p { color: #94a3b8; line-height: 1.6; }
      code { color: #38bdf8; }
    </style>
  </head>
  <body>
    <main>
      <h1>A 股 ETF 桌面控制台</h1>
      <p>正在检查本地 FastAPI 后端并打开动态控制台。</p>
      <p>如果长时间停留在这里，请在项目根目录运行：</p>
      <p><code>bash scripts/run_app.sh</code></p>
      <p>安全边界：本桌面壳不接券商 API，不真实下单，不读取真实账户。</p>
    </main>
  </body>
</html>
