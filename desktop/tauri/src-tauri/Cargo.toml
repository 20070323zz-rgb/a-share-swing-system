[package]
name = "a-share-etf-desktop"
version = "0.1.0"
description = "Local desktop shell for the A-share ETF paper-trading control room"
authors = ["dayin"]
edition = "2021"

[lib]
name = "a_share_etf_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
once_cell = "1.20"
