schema_version: 1
version: universe_v2_registry
created_at: 2026-07-08 18:52:15 CST
status: QUALIFIED
purpose: Track Universe V2 candidate qualification without creating a second ETF data store.
data_source_policy:
  single_source_of_truth: true
  unified_etf_daily_database: data/etf_daily/*.csv
  forbidden:
  - No second ETF daily database.
  - No copied V2 daily data.
  - No direct trade-pool activation from registry.
source_files:
- configs/universe_versions/universe_v2_candidate.yaml
- reports/universe_quality_review.csv
- reports/etf_risk_profile.csv
- data/backtest_trade_pool.csv
- data/etf_daily/*.csv
qualification_policy:
  history_ok: '>= 240 local trading rows and latest date equals 2026-07-08'
  history_observe: 120-239 rows or otherwise short relative to V2 peer set
  liquidity_ok: 60d average amount >= 50,000,000
  liquidity_watch: 20,000,000 <= 60d average amount < 50,000,000
  liquidity_low: 5,000,000 <= 60d average amount < 20,000,000
  liquidity_ultra_low: < 5,000,000
  qdii_policy: Observe only until a dedicated QDII premium/FX/calendar policy exists.
  qualified_research: Eligible for V2 Research Universe preparation, not replay or trade activation.
summary:
  candidate_count: 36
  qualified_research: 16
  observe: 15
  reject: 5
  all_candidates_in_unified_etf_db: true
  needs_data_refresh_count: 0
  needs_backfill_count: 0
  research_universe_status: READY_FOR_REPLAY_PREPARATION
  replay_status: NOT_STARTED
  trade_pool_activation: BLOCKED
